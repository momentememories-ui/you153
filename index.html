<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Kanit:wght@300;400;500&family=Orbitron:wght@600&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8fa3;
            --secondary: #ffcad4;
            --bg: #fff5f7;
            --text: #7a5c61;
            --overlay-bg: rgba(0, 0, 0, 0.6);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            scroll-behavior: smooth;
            overflow-x: hidden;
            position: relative;
        }

        /* เอฟเฟกต์เบลอ */
        #main-app-content { transition: filter 0.3s ease; }
        .modal-active #main-app-content { filter: blur(8px); }

        /* --- Login Page --- */
        #login-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .pass-dots { display: flex; gap: 15px; margin-bottom: 20px; }
        .dot { width: 15px; height: 15px; border: 2px solid var(--primary); border-radius: 50%; transition: 0.2s; }
        .dot.active { background: var(--primary); transform: scale(1.2); box-shadow: 0 0 10px var(--primary); }
        #error-msg { height: 20px; color: var(--primary); font-size: 0.8rem; margin-bottom: 20px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; }
        .key { 
            width: 80px; height: 80px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .key:active { transform: scale(0.9); background: var(--secondary); }

        /* --- Main Content --- */
        #main-app { display: none; padding-bottom: 120px; }
        section { min-height: 100vh; padding: 40px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; }

        .calendar-wrap { display: flex; gap: 10px; margin-bottom: 10px; }
        .calendar-card {
            background: white; width: 90px; height: 110px; border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #eee;
        }
        .cal-top { background: var(--primary); height: 28px; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }
        .cal-num { font-size: 1.5rem; font-weight: 600; color: var(--text); padding-top: 15px; display: block; text-align: center; }
        .cal-unit { font-size: 0.6rem; color: #bbb; display: block; text-align: center; }

        .clock-container {
            background: #fff; padding: 15px 25px; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.2);
            border: 4px solid var(--secondary); display: flex; gap: 10px; align-items: center; margin: 20px 0;
        }
        .clock-val { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--primary); }

        /* --- Photo Grid --- */
        .heart-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 8vmin); 
            grid-template-rows: repeat(5, 17vmin); 
            gap: 1.5vmin; 
            margin: 0 auto;
            justify-content: center; 
            align-content: center;
        }
        .img-item { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 2px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .img-item:active { transform: scale(0.95); }
        
        .p1 { grid-column: 3 / 5; grid-row: 1; } 
        .p2 { grid-column: 7 / 9; grid-row: 1; }
        .p3 { grid-column: 1 / 3; grid-row: 2; } 
        .p4 { grid-column: 3 / 5; grid-row: 2; }
        .p5 { grid-column: 5 / 7; grid-row: 2; } 
        .p6 { grid-column: 7 / 9; grid-row: 2; }
        .p7 { grid-column: 9 / 11; grid-row: 2; } 
        .p8 { grid-column: 3 / 5; grid-row: 3; } 
        .p11 { grid-column: 5 / 7; grid-row: 3; } 
        .p10 { grid-column: 7 / 9; grid-row: 3; }
        .p12 { grid-column: 4 / 6; grid-row: 4; } 
        .p13 { grid-column: 6 / 8; grid-row: 4; }
        .p9 { grid-column: 5 / 7; grid-row: 5; }

        /* --- Envelope & Paper --- */
        .envelope-container { position: relative; height: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .envelope { width: 240px; height: 150px; background: #ffc1cc; border-radius: 0 0 10px 10px; position: relative; cursor: pointer; z-index: 10; margin-top: 50px; transition: 0.3s; }
        .envelope::before { content: ''; position: absolute; top: -100px; left: 0; border-left: 120px solid transparent; border-right: 120px solid transparent; border-bottom: 100px solid #ff8fa3; transition: 0.5s; z-index: 12; transform-origin: bottom; }
        .envelope.open::before { transform: rotateX(180deg); z-index: 1; }
        .paper { position: absolute; top: 10px; left: 10px; width: 220px; height: 130px; background: white; border-radius: 5px; transition: 0.7s; z-index: 5; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .envelope.open .paper { transform: translateY(-220px); height: 380px; width: 300px; left: -30px; z-index: 15; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .tap-text { font-size: 0.9rem; color: var(--primary); margin-top: 15px; animation: bounce 1.5s infinite; font-weight: 500; z-index: 11; position: relative; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

        /* --- Gift Boxes --- */
        .boxes-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 35px; max-width: 300px; margin: 0 auto; }
        
        /* ปรับอนิเมชันตอนยังไม่กด ให้สั่นรุนแรง ล่อให้กด */
        .gift-box { 
            font-size: 65px; 
            cursor: pointer; 
            display: inline-block; 
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); 
            animation: super-pulse-bounce 0.8s ease-in-out infinite; 
            transition: transform 0.2s; 
        }
        .gift-box:active { transform: scale(0.85); animation: none; }
        
        @keyframes super-pulse-bounce { 
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 
            15% { transform: translateY(-15px) scale(1.15) rotate(-12deg); } 
            30% { transform: translateY(0) scale(0.9) rotate(12deg); } 
            45% { transform: translateY(-10px) scale(1.1) rotate(-8deg); } 
            60% { transform: translateY(0) scale(0.95) rotate(8deg); } 
            75% { transform: translateY(-5px) scale(1.05) rotate(-4deg); } 
        }
        
        /* ปรับอนิเมชันสั่นสะเทือนแบบรุนแรงพิเศษ ตอนถูกกดเปิด */
        .box-selected-shake { animation: extreme-shake 0.8s ease-in-out !important; }
        @keyframes extreme-shake { 
            0% { transform: scale(1) rotate(0deg); } 
            10% { transform: scale(1.3) rotate(-25deg) translateX(-10px); } 
            20% { transform: scale(1.3) rotate(25deg) translateX(10px); } 
            30% { transform: scale(1.4) rotate(-25deg) translateY(-10px); } 
            40% { transform: scale(1.4) rotate(25deg) translateY(10px); } 
            50% { transform: scale(1.3) rotate(-20deg) translateX(-5px); } 
            60% { transform: scale(1.3) rotate(20deg) translateX(5px); } 
            70% { transform: scale(1.2) rotate(-10deg); } 
            80% { transform: scale(1.1) rotate(10deg); } 
            90% { transform: scale(1.05) rotate(-5deg); } 
            100% { transform: scale(1) rotate(0deg); } 
        }

        /* --- Modal & UI --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0); backdrop-filter: blur(0px); z-index: 10000; align-items: center; justify-content: center; transition: background 0.4s ease, backdrop-filter 0.4s ease; overflow: hidden; }
        .modal.active { display: flex; background: var(--overlay-bg); backdrop-filter: blur(8px); }
        .modal-content { display: flex; flex-direction: column; align-items: center; transform: scale(0.5); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease; z-index: 10002; width: 90%; max-width: 400px; }
        .modal.active .modal-content { transform: scale(1); opacity: 1; }
        .polaroid { background: white; padding: 12px 12px 50px 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border-radius: 2px; width: 85%; max-width: 260px; margin: 0 auto; position: relative; }
        .polaroid img { width: 100%; height: auto; border: 1px solid #f9f9f9; display: block; }
        .polaroid-text { font-family: 'Kanit', sans-serif; font-size: 0.85rem; color: #666; margin-top: 15px; text-align: center; line-height: 1.4; white-space: pre-wrap; }

        nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 10px 25px; border-radius: 40px; display: flex; gap: 20px; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        nav a { text-decoration: none; font-size: 24px; }
        .btn-close { background: var(--primary); color: white; border: none; padding: 12px 35px; border-radius: 30px; cursor: pointer; margin-top: 25px; font-family: 'Prompt'; font-weight: 600; }
        
        .floating-heart { 
            position: absolute; 
            bottom: -30px; 
            color: #ff8fa3; 
            opacity: 0; 
            pointer-events: none; 
            z-index: 10001; 
            animation: floatUp 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            15% { opacity: 0.85; } 
            100% { transform: translateY(-105vh) translateX(var(--random-x)) scale(1.5); opacity: 0; } 
        }

        .pink-text { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body id="body-content">

    <div id="login-page">
        <h3 style="font-weight: 300; color: var(--primary); margin-bottom: 10px;">Enter Password ♡</h3>
        <div id="error-msg"></div>
        <div class="pass-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
            <div class="key" onclick="addNum('1')">1</div><div class="key" onclick="addNum('2')">2</div><div class="key" onclick="addNum('3')">3</div>
            <div class="key" onclick="addNum('4')">4</div><div class="key" onclick="addNum('5')">5</div><div class="key" onclick="addNum('6')">6</div>
            <div class="key" onclick="addNum('7')">7</div><div class="key" onclick="addNum('8')">8</div><div class="key" onclick="addNum('9')">9</div>
            <div style="width:80px"></div><div class="key" onclick="addNum('0')">0</div><div class="key" onclick="clearPass()" style="font-size:14px; color:var(--primary);">ลบ</div>
        </div>
    </div>

    <div id="main-app-content">
        <div id="main-app">
            <section id="time-sec">
                <div style="font-size: 1rem; color: var(--primary); margin-bottom: 20px;">เราเดินมาด้วยกันแล้ว...</div>
                <div class="calendar-wrap">
                    <div class="calendar-card"><span class="cal-top">ปี</span><span class="cal-num" id="y">0</span><span class="cal-unit">YEARS</span></div>
                    <div class="calendar-card"><span class="cal-top">เดือน</span><span class="cal-num" id="m">0</span><span class="cal-unit">MONTHS</span></div>
                    <div class="calendar-card"><span class="cal-top">วัน</span><span class="cal-num" id="d">0</span><span class="cal-unit">DAYS</span></div>
                </div>
                <div class="clock-container">
                    <span class="clock-val" id="ch">00</span> : <span class="clock-val" id="cm">00</span> : <span class="clock-val" id="cs">00</span>
                </div>
                <p style="font-size: 0.8rem; opacity: 0.6;">ทุกวินาทีมีค่าเมื่ออยู่กับเธอ ❤️</p>
            </section>

            <section id="photo-sec">
                <h2 style="font-family: 'Prompt'; font-size: 1.2rem; color: var(--primary); margin-bottom: 35px; text-align: center;">ความทรงจำของเรา<br>ตั้งแต่วันแรกที่ได้รู้จักกัน จนถึงวันนี้</h2>
                <div class="heart-grid">
                    <img src="photo1.jpg" class="img-item p1" onclick="zoomImg(this, 'สุขสันต์วันครบรอบ9เดือน')">
                    <img src="photo2.jpg" class="img-item p2" onclick="zoomImg(this, 'รักกนพพพ')">
                    <img src="photo3.jpg" class="img-item p3" onclick="zoomImg(this, 'อยู่กับเค้าไปนานนๆ')">
                    <img src="photo4.jpg" class="img-item p4" onclick="zoomImg(this, 'ขอบคุณที่ยังอยู่ด้วยกัน')">
                    <img src="photo5.jpg" class="img-item p5" onclick="zoomImg(this, 'คิดถึงอ้วนน')">
                    <img src="photo6.jpg" class="img-item p6" onclick="zoomImg(this, 'รอวันที่ได้เจอกัน')">
                    <img src="photo7.jpg" class="img-item p7" onclick="zoomImg(this, 'ของขวัญชิ้นนี้ตั้งใจทำให้อ้วน')">
                    <img src="photo8.jpg" class="img-item p8" onclick="zoomImg(this, 'อ้วนน่ารักมากๆ')">
                    <img src="photo11.jpg" class="img-item p11" onclick="zoomImg(this, 'ซัพพอร์ตของเค้า')">
                    <img src="photo10.jpg" class="img-item p10" onclick="zoomImg(this, 'อยู่ข้างๆอ้วนเสมอ')">
                    <img src="photo12.jpg" class="img-item p12" onclick="zoomImg(this, 'คนเก่งของเค้า')">
                    <img src="photo13.jpg" class="img-item p13" onclick="zoomImg(this, 'ไม่ว่าอะไรจะเกิดขึ้น\nเค้ายังอยู่ตรงนี้นะ')">
                    <img src="photo9.jpg" class="img-item p9" onclick="zoomImg(this, 'รักที่สุดด')">
                </div>
            </section>

            <section id="letter-sec">
                <div class="envelope-container">
                    <div class="envelope" id="env" onclick="openLetter()">
                        <div class="paper" id="paper">
                            <div id="typewriter" style="font-size: 0.82rem; line-height: 1.6; color: #555; white-space: pre-wrap; text-align: center;"></div> 
                        </div>
                    </div>
                    <div class="tap-text" id="env-text">แตะเพื่ออ่านจดหมาย ♡</div>
                </div>
            </section>

            <section id="fun-sec">
                <h3 style="color: var(--primary); margin-bottom: 40px;">เลือกของขวัญของคุณ! 🎁</h3>
                <div class="boxes-grid">
                    <div class="gift-box" onclick="pickBox(this, 'pt1.jpg')">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 'pt2.jpg')">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 'pt3.jpg')">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 'pt4.jpg')">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 'pt5.jpg')">🎁</div>
                </div>
            </section>

            <nav>
                <a href="#time-sec">⏰</a>
                <a href="#photo-sec">🖼️</a>
                <a href="#letter-sec">✉️</a>
                <a href="#fun-sec">🎁</a>
            </nav>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modal-box">
            <div id="photo-area">
                <div class="polaroid">
                    <img id="modal-img" src="">
                    <div id="img-caption" class="polaroid-text"></div>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal()">ปิด ♡</button>
        </div>
    </div>

    <audio id="bgm" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <script>
        let pass = "";
        const target = "261268"; 
        const errorMsgs = ["รหัสผิดนะเจ้าคนดี 🥺", "จำไม่ได้หรอเนี่ย งอนละนะ! 😤", "เกือบถูกแล้ว ลองอีกนิดดด", "อ๊ะ! ผิดแล้วตัวแสบ 😜"];

        function addNum(n) {
            if(pass.length < 6) {
                pass += n;
                document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i < pass.length));
                if(pass.length === 6) {
                    if(pass === target) {
                        document.getElementById('login-page').style.display = 'none';
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('bgm').play().catch(() => {});
                        startTimer();
                    } else {
                        document.getElementById('error-msg').innerText = errorMsgs[Math.floor(Math.random()*errorMsgs.length)];
                        document.getElementById('login-page').classList.add('shake');
                        setTimeout(() => { document.getElementById('login-page').classList.remove('shake'); clearPass(); }, 400);
                    }
                }
            }
        }
        function clearPass() { pass = ""; document.querySelectorAll('.dot').forEach(d => d.classList.remove('active')); }

        function startTimer() {
            // วันที่คบกัน: 26 ธันวาคม 2568 (2025-12-26)
            const start = new Date("2025-12-26T00:00:00"); 
            setInterval(() => {
                const now = new Date();
                let y = now.getFullYear() - start.getFullYear();
                let m = now.getMonth() - start.getMonth();
                let d = now.getDate() - start.getDate();
                if(d < 0) { m--; let prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); }
                if(m < 0) { y--; m += 12; }
                document.getElementById('y').innerText = y;
                document.getElementById('m').innerText = m;
                document.getElementById('d').innerText = d;
                document.getElementById('ch').innerText = String(now.getHours()).padStart(2,'0');
                document.getElementById('cm').innerText = String(now.getMinutes()).padStart(2,'0');
                document.getElementById('cs').innerText = String(now.getSeconds()).padStart(2,'0');
            }, 1000);
        }

        function startFloatingHearts() {
            const container = document.getElementById('modal');
            const interval = setInterval(() => {
                if(!container.classList.contains('active')) { clearInterval(interval); return; }
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 90 + 5 + 'vw';
                heart.style.setProperty('--random-x', (Math.random() * 160 - 80) + 'px');
                heart.style.fontSize = (Math.random() * 18 + 16) + 'px';
                heart.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 3500);
            }, 250);
        }

        function zoomImg(el, caption) {
            document.getElementById('photo-area').style.display = 'block';
            document.getElementById('modal-img').src = el.src;
            document.getElementById('img-caption').innerText = caption;
            document.getElementById('body-content').classList.add('modal-active');
            document.getElementById('modal').style.display = 'flex';
            setTimeout(() => { document.getElementById('modal').classList.add('active'); startFloatingHearts(); }, 10);
        }

        function openLetter() {
            document.getElementById('env').classList.add('open');
            document.getElementById('env-text').style.opacity = '0';
            
            // ข้อความจดหมายตามที่กำหนด
            const msgPart1 = "สุขสันต์วันครบรอบ 9 เดือนนะอ้วน ❤️\n\nขอบคุณที่เข้ามาเป็นส่วนหนึ่งในชีวิตเค้า\nขอบคุณที่อยู่ด้วยกันมาจนถึงวันนี้\nถึงระหว่างทางเราจะมีทะเลาะ\nมีงอน มีไม่เข้าใจกันบ้าง\nแต่สุดท้ายเราก็ยังเลือกที่จะกลับมา\nจับมือกันเหมือนเดิม\nเค้าดีใจนะที่มีอ้วนอยู่ข้างๆ\nและเค้าจะคอยซัพพอร์ตอ้วน\nเป็นกำลังใจให้อ้วนในทุกๆ เรื่องเลยนะ\nขอให้เราสองคนอยู่ด้วยกันไปนานๆ\nผ่านเรื่องต่างๆ ไปด้วยกัน\nและมีวันครบรอบแบบนี้\nไปอีกหลายๆ ครั้งเลยนะ\n\n";
            const msgPart2 = "รักอ้วนมากๆ";
            
            let i = 0;
            let j = 0;
            const targetEl = document.getElementById('typewriter');
            
            if(targetEl.innerHTML === "") {
                function typePart1() {
                    if (i < msgPart1.length) {
                        targetEl.innerHTML += msgPart1.charAt(i) === '\n' ? '<br>' : msgPart1.charAt(i);
                        i++; 
                        document.getElementById('paper').scrollTop = document.getElementById('paper').scrollHeight;
                        setTimeout(typePart1, 50);
                    } else {
                        const pinkSpan = document.createElement('span');
                        pinkSpan.className = 'pink-text';
                        targetEl.appendChild(pinkSpan);
                        
                        function typePart2() {
                            if (j < msgPart2.length) {
                                pinkSpan.innerHTML += msgPart2.charAt(j);
                                j++;
                                document.getElementById('paper').scrollTop = document.getElementById('paper').scrollHeight;
                                setTimeout(typePart2, 50);
                            }
                        }
                        typePart2();
                    }
                }
                setTimeout(typePart1, 1000);
            }
        }

        function pickBox(el, imgSrc) {
            if(el.innerText === "✨") return;
            el.style.animation = 'none';
            el.offsetHeight; // Reset animation
            el.classList.add('box-selected-shake');
            setTimeout(() => {
                document.getElementById('photo-area').style.display = 'block';
                document.getElementById('modal-img').src = imgSrc;
                document.getElementById('img-caption').innerText = "";
                document.getElementById('body-content').classList.add('modal-active');
                document.getElementById('modal').style.display = 'flex';
                setTimeout(() => { document.getElementById('modal').classList.add('active'); startFloatingHearts(); }, 10);
                el.classList.remove('box-selected-shake');
                el.innerText = "✨";
            }, 800);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('body-content').classList.remove('modal-active');
            setTimeout(() => { document.getElementById('modal').style.display = 'none'; }, 400);
        }
    </script>
</body>
</html>
